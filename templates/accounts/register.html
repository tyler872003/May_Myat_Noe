{% extends 'base.html' %}
{% block title %}Create account · FinanceAI{% endblock %}
{% block content %}
<div class="auth-wrap justify-content-center">
  <div class="surface p-4 p-md-5 auth-panel text-center">
    <div class="brand-mark mx-auto mb-3" style="width:48px;height:48px"><i class="bi bi-sparkles"></i></div>
    <h1 class="h3 fw-bold">Create account</h1>
    <p class="text-muted">A lighter way to track income, spending, and savings.</p>
    <form method="post" class="text-start mt-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-mint w-100">Register</button>
    </form>
    <p class="mt-4 mb-0">Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </div>
</div>
{% endblock %}
