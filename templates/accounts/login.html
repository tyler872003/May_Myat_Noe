{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:420px;margin:auto">
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>
  <p>No account? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
