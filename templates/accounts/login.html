{% extends 'base.html' %}
{% block title %}Login · FinanceAI{% endblock %}
{% block content %}
<div class="auth-wrap justify-content-center">
  <div class="surface p-4 p-md-5 auth-panel text-center">
    <div class="brand-mark mx-auto mb-3" style="width:48px;height:48px"><i class="bi bi-leaf"></i></div>
    <h1 class="h3 fw-bold">Welcome back</h1>
    <p class="text-muted">Sign in to your money overview.</p>
    <form method="post" class="text-start mt-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-mint w-100">Login</button>
    </form>
    <a href="{% url 'forgot_password' %}">Forgot password?</a>
    <p class="mt-4 mb-1">No account? <a href="{% url 'register' %}">Register</a></p>
  </div>
</div>
{% endblock %}
