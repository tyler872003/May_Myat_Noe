{% extends "base.html" %}
{% block title %}Forgot password · FinanceAI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 text-center">
        <div class="display-5 mb-2"><i class="bi bi-key"></i></div>
        <h2 class="h4 fw-bold">Forgot your password?</h2>
        <p class="text-muted">Enter your email and we'll send you a 6-digit code.</p>
        <form method="post">
          {% csrf_token %}
          <input type="email" name="email" class="form-control mb-3"
                 placeholder="Your email" required autofocus>
          <button type="submit" class="btn btn-mint w-100">Send code</button>
        </form>
        <p class="small mt-3 mb-0"><a href="{% url 'login' %}">Back to login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
