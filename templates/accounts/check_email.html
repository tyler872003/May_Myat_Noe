{% extends "base.html" %}
{% block title %}Check your email · FinanceAI{% endblock %}
{% block content %}
<div class="auth-wrap justify-content-center">
  <div class="surface p-4 p-md-5 auth-panel text-center">
    <div class="display-5 mb-2">✉️</div>
    <h1 class="h3 fw-bold">Check your email</h1>
    <p>We sent a verification link to <strong>{{ email }}</strong>.</p>
    <p class="text-muted">Click the link in the email to activate your account.</p>
    <a class="btn btn-mint" href="{% url 'login' %}">Back to login</a>
    <p class="text-muted small mt-3 mb-0">
      Didn't get it? <a href="{% url 'resend_verification' %}">Resend email</a>
    </p>
  </div>
</div>
<script>
  const timer = setInterval(async () => {
    const r = await fetch("{% url 'check_verified' %}?email={{ email|urlencode }}");
    const data = await r.json();
    if (data.verified) {
      clearInterval(timer);
      window.location.href = "{% url 'login' %}";
    }
  }, 3000);
</script>
{% endblock %}
