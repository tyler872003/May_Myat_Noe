<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FinanceAI{% endblock %}</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }

    nav {
      background: #1f2937;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
    }

    nav a {
      color: #fff;
      margin-left: 16px;
      text-decoration: none;
    }

    .container {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .grid .card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #6b7280;
    }

    .grid .card p {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    @media (max-width: 700px) {
      .grid2 {
        grid-template-columns: 1fr;
      }
    }

    .bar {
      background: #e5e7eb;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
    }

    .bar .fill {
      height: 100%;
    }

    .ok {
      background: #10b981;
    }

    .warning {
      background: #f59e0b;
    }

    .over {
      background: #ef4444;
    }

    .message {
      margin-bottom: 12px;
      border-left: 4px solid #10b981;
    }

    .message-warning {
      border-left-color: #f59e0b;
    }

    .message-error {
      border-left-color: #ef4444;
    }

    input,
    select {
      display: block;
      width: 100%;
      padding: 8px;
      margin: 6px 0 14px;
      box-sizing: border-box;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: 0;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    th,
    td {
      padding: 8px 6px;
    }
  </style>
</head>

<body>
  <nav>
    <div>
      <strong>FinanceAI</strong>
      {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'transaction_list' %}">Transactions</a>
      <a href="{% url 'budget_list' %}">Budgets</a>
      <a href="{% url 'assistant_chat' %}">Assistant</a>
      {% endif %}
    </div>
    <div>
      {% if user.is_authenticated %}
      <span>{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}" style="display:inline">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
      {% else %}
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}">Register</a>
      {% endif %}
    </div>
  </nav>
  <div class="container">
    {% for m in messages %}
    <div class="card message {% if m.tags == 'warning' %}message-warning{% elif m.tags == 'error' %}message-error{% endif %}">{{ m }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
</body>

</html>
